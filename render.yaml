services:
  - type: web
    name: phishguard-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","https://*.onrender.com","https://*.vercel.app"]'

  - type: web
    name: phishguard-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phishguard-backend
          property: url
